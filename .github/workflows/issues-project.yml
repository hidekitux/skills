name: Issue Project Status

# GitHub Projects has built-in workflows for automatic item addition and for
# moving closed Issues to Done, but no built-in transition for reopened
# Issues. This workflow restores the documented non-terminal Status for a
# reopened Issue using the repository-declared Project configuration.
#
# The step needs a token with `project` scope because the default GITHUB_TOKEN
# cannot mutate Projects v2. Store a least-privilege PAT in the
# PROJECTS_TOKEN repository secret; the step skips with a diagnostic when the
# secret is not configured so the repository never fails on missing access.

on:
  issues:
    types: [reopened]

permissions:
  contents: read
  issues: read

jobs:
  reopen-backlog:
    name: Set reopened Issue to Backlog
    runs-on: ubuntu-latest
    steps:
      # v4 -> 11d5960a326750d5838078e36cf38b85af677262
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Go toolchain
        uses: ./.github/actions/setup-go
      - name: Restore Backlog Status on reopen
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          if [ -z "$PROJECTS_TOKEN" ]; then
            echo "PROJECTS_TOKEN secret is not configured; skipping (fail-safe)."
            exit 0
          fi
          go run ./cmd/set-issue-project-status --root . --repo "${{ github.repository }}" --issue "${{ github.event.issue.number }}" --status Backlog
