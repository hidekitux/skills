name: Policy (Signatures)

on:
  # zizmor: ignore[dangerous-triggers] This checks out only the trusted base SHA and never executes PR code.
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Key on the PR number rather than github.ref: on pull_request_target,
  # github.ref resolves to the base branch (refs/heads/main), so grouping by it
  # would let simultaneous Pull Requests cancel each other's signature checks.
  # cancel-in-progress stays enabled so a newer run on the same PR supersedes
  # the older one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-signatures:
    name: Validate commit signatures
    runs-on: ubuntu-latest
    steps:
      # Checkout stays inline (not in .github/actions/setup-go) so the
      # trusted-base checkout of pull_request_target remains visible to the
      # security audit; see .github/workflows/README.md.
      # v4 -> 11d5960a326750d5838078e36cf38b85af677262
      - name: Check out trusted base commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      # v5 -> 40f1582b2485089dde7abd97c1529aa768e1baff
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go.sum
      - name: Verify GitHub commit signatures
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          go run ./cmd/validate-pr-commit-signatures
          --repo "$REPOSITORY" --pull-request "$PULL_REQUEST_NUMBER"
