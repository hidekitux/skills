name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-security:
    name: Audit workflow security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # zizmor audits workflows, composite actions, and dependabot.yml, so
      # any change under .github/ starts the audit.
      - name: Determine changed GitHub configuration files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}" -- .github | grep -q .; then
            echo "github-changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "github-changed=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Audit GitHub Actions workflows and actions
        if: steps.changed.outputs.github-changed == 'true'
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # advanced-security: true uploads SARIF to GitHub Code Scanning,
          # which adds the unnameable `Code scanning results / zizmor` check.
          # Per the naming rules in .github/workflows/README.md, that check is
          # an accepted informational side effect — never a required context;
          # the named job stays the required check identity.
          advanced-security: true
