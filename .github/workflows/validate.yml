name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-checks:
    name: Validate repository checks
    runs-on: ubuntu-latest
    steps:
      # v4 -> 11d5960a326750d5838078e36cf38b85af677262
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      # v3 -> 3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
      - name: Set up mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install: false
          cache: true
      - name: Prepare Worktree environment
        run: bash scripts/setup/setup-environment.sh
      - name: Install mise tools in the Worktree environment
        run: bash scripts/setup/run-mise.sh install
      - name: Validate repository checks
        env:
          CHECK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/setup/run-mise.sh run check:all
      - name: Validate host installations
        run: bash scripts/setup/run-mise.sh run check:hosts
  lint:
    name: Validate lint
    runs-on: ubuntu-latest
    steps:
      # v4 -> 11d5960a326750d5838078e36cf38b85af677262
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      # v3 -> 3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
      - name: Set up mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install: false
          cache: true
      - name: Prepare Worktree environment
        run: bash scripts/setup/setup-environment.sh
      - name: Install mise tools in the Worktree environment
        run: bash scripts/setup/run-mise.sh install
      - name: Lint workflows, Python, shell, and Go sources
        run: bash scripts/setup/run-mise.sh run lint:all
  test:
    name: Validate tests
    runs-on: ubuntu-latest
    steps:
      # v4 -> 11d5960a326750d5838078e36cf38b85af677262
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      # v3 -> 3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
      - name: Set up mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install: false
          cache: true
      - name: Prepare Worktree environment
        run: bash scripts/setup/setup-environment.sh
      - name: Install mise tools in the Worktree environment
        run: bash scripts/setup/run-mise.sh install
      - name: Run repository tests
        run: bash scripts/setup/run-mise.sh run test:all
  verify-fsl:
    name: Validate FSL specifications
    runs-on: ubuntu-latest
    steps:
      # v4 -> 11d5960a326750d5838078e36cf38b85af677262
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      # v3 -> 3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
      - name: Set up mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install: false
          cache: true
      - name: Prepare Worktree environment
        run: bash scripts/setup/setup-environment.sh
      - name: Install mise tools in the Worktree environment
        run: bash scripts/setup/run-mise.sh install
      - name: Verify FSL specifications
        run: bash scripts/setup/run-mise.sh run verify:fsl
  skill-checks:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      # v4 -> 11d5960a326750d5838078e36cf38b85af677262
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      # v3 -> 3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518
      - name: Set up mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          install: false
          cache: true
      - name: Prepare Worktree environment
        run: bash scripts/setup/setup-environment.sh
      - name: Install mise tools in the Worktree environment
        run: bash scripts/setup/run-mise.sh install
      - name: Validate repository skills
        run: bash scripts/setup/run-mise.sh run check:skills
