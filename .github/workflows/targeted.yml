name: Validate (Targeted)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fsl-mutation:
    name: Validate FSL mutation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare Worktree environment
        run: bash scripts/setup/setup-environment.sh
      - name: Set up mise toolchain
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: true
          install_args: "go"
          cache: true
      # The job always runs so a future required-context promotion cannot leave
      # a pull request pending; the targeted command is a successful no-op when
      # no spec under specs/ or skills/**/specs/ changed. Surviving mutants are
      # reported, not hidden: the mutation log and exit code surface them, and
      # the triage register tracks them.
      - name: Mutate changed FSL specifications
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/setup/run-mise.sh run mutate:fsl-changed -- "$BASE_SHA"
  go-dependency-security:
    name: Audit Go dependency security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare Worktree environment
        run: bash scripts/setup/setup-environment.sh
      - name: Set up mise toolchain
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: true
          install_args: "go go:golang.org/x/vuln/cmd/govulncheck"
          cache: true
      # Tier 2: the job always runs so a future required-context promotion cannot
      # leave a pull request pending; the scan step is a successful no-op when no
      # Go source or module file changed. Reachable findings fail the job;
      # non-reachable findings are reported and do not fail (Issue #178).
      - name: Determine changed Go files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "${BASE_SHA}" "${GITHUB_SHA}" -- go.mod go.sum '*.go' | grep -q .; then
            echo "go-changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "go-changed=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Audit Go dependencies for known vulnerabilities
        if: steps.changed.outputs.go-changed == 'true'
        run: bash scripts/setup/run-mise.sh run check:go-vuln
      - name: Report no Go changes
        if: steps.changed.outputs.go-changed == 'false'
        run: echo "No Go source or module files changed; skipping Go dependency scan."
