name: Policy (Issues)

on:
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: read

jobs:
  issue-policy:
    name: Validate issue policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Go toolchain
        uses: $/.github/actions/setup-go
      - name: Prepare Worktree environment
        run: bash scripts/setup/setup-environment.sh
      - name: Validate issue title
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: go run ./cmd/validate-work-item-title --title "$ISSUE_TITLE"
      - name: Validate issue body
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: go run ./cmd/validate-issue-body --title "$ISSUE_TITLE" --body "$ISSUE_BODY"
      - name: Validate issue project
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_READ_TOKEN || github.token }}
        # create-issue sets the Project fields after the Issue opens, so wait
        # up to three minutes for them before failing (Issue #478).
        run: go run ./cmd/validate-issue-project --root . --repo "${{ github.repository }}" --issue "${{ github.event.issue.number }}" --wait 3m
