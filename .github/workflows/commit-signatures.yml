name: Pull-request commit signatures

on:
  # zizmor: ignore[dangerous-triggers] This checks out only the trusted base SHA and never executes PR code.
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  signatures:
    name: Validate signed pull-request commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      # v5 -> 40f1582b2485089dde7abd97c1529aa768e1baff
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.5'
      - name: Verify GitHub commit signatures
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          go run ./cmd/validate-pr-commit-signatures
          --repo "$REPOSITORY" --pull-request "$PULL_REQUEST_NUMBER"
