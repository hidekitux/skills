# actionlint 1.7.12 rejects the self-repository syntax (`uses: $/...`) that
# GitHub added on 2026-07-30. Remove this ignore once actionlint supports it:
# https://github.com/rhysd/actionlint/issues/711
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      - 'specifying action "\$/[^"]+" in invalid format because ref is missing'
