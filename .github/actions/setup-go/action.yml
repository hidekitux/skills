name: Set up the repository Go toolchain
description: >-
  Set up the pinned Go toolchain with module and build caching. Checkout runs
  as a separate preceding step, because GitHub loads local actions from the
  checked-out workspace.

runs:
  using: composite
  steps:
    # v5 -> 40f1582b2485089dde7abd97c1529aa768e1baff
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: '1.26.6'
        cache: true
        cache-dependency-path: go.sum