name: Set up the repository Go toolchain
description: >-
  Set up the pinned Go toolchain with module and build caching. Workflows load
  this action through the self-repository syntax (`$/`), which needs no
  checkout. Checkout still runs as a separate preceding step, because the
  cache key reads `go.sum` from the workspace.

runs:
  using: composite
  steps:
    # v5 -> 40f1582b2485089dde7abd97c1529aa768e1baff
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: '1.26.6'
        cache: true
        cache-dependency-path: go.sum