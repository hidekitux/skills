# Retained release evidence for the public status documentation.
#
# The evidence Pull Request of the release procedure (docs/releasing.md) sets
# released: true and records the tag, the GitHub Release URL, and the tag
# target commit after mise run publish:release succeeds. Until then the public
# status section must not claim a verified release or a pinned installation;
# check-public-status enforces that boundary.
#
# pinned_installation records one pinned installation per host after
# publication. The key is optional, and no check validates it; see
# docs/public-skill-status.md.
