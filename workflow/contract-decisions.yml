schema_version: 1

# Contract decisions for the redesign Issue #326 and its Sub-issue #331.
# docs/architecture.md records the reasoning; this file is the machine-readable
# source the check-contract-decisions repository check enforces.
#
# Every surface an outside consumer can depend on without reading the Go
# implementation is one entry. classification is preserved or changed.
#
# A preserved entry states why the surface still behaves as it did at the
# measured baseline 4cce0641bbc9bc28c9bba47522a6071b0acded69 and names the
# check that observes it.
#
# A changed entry additionally states the old behavior, the new behavior, the
# reason, the requester confirmation, the migration condition, the
# compatibility impact, and the validation observation.
#
# Every evidence path must exist in the tree, and every id must appear in
# docs/architecture.md. No entry may carry a version identifier such as v1 or
# v2 without a version_decision field, which Issue #326 allows only after a
# separate recorded decision and confirmation.

contracts:
  - id: cli-command-names
    surface: The command names and flags of every program under cmd/.
    classification: preserved
    owner: composition
    evidence:
      - cmd
      - SCRIPT_TESTS.toml
    reason: >-
      The redesign moved external calls behind provider ports without renaming
      a command, adding a flag, or removing one. The three Project commands
      changed only their call sites.
    check: check:repository (validate-script-tests) maps 43 commands and 12 scripts.

  - id: repository-check-list
    surface: >-
      The named checks cmd/check-repository runs and prints, and the total it
      reports on the final line.
    classification: changed
    owner: composition
    evidence:
      - cmd/check-repository/main.go
      - docs/validation-tiers.md
    old: >-
      The command ran 21 checks and its final line read
      "check:repository: all 21 repository checks passed."
    new: >-
      The command runs 24 checks and its final line reads
      "check:repository: all 24 repository checks passed." The added checks are
      check-module-boundaries, check-contract-decisions, and
      check-cutover-record.
    reason: >-
      Issue #328 enforces the recorded module ownership in continuous
      integration, Issue #331 enforces the contract decisions the same way, and
      Issue #332 enforces the cutover record. An unenforced record drifts, which
      is the failure the architecture record names.
    confirmation: >-
      The requester confirmed this classification while planning Issue #331 and
      chose to record both landed behavior changes as changed. The requester
      confirmed the third added check while planning Issue #332.
    migration: >-
      A consumer that reads the printed list by name keeps working, because the
      list grows and no existing name was removed or renamed. A consumer that
      asserts an exact total updates that total once.
    compatibility: >-
      The exit status contract is unchanged: zero when every check passes and
      one when any check fails. Only the membership of the list and the printed
      total differ.
    validation: >-
      go run ./cmd/check-repository prints the 24 named checks and the matching
      total, and cmd/check-repository/main_test.go covers the aggregate result.

  - id: mise-task-names
    surface: The task names declared in mise.toml and referenced by documentation.
    classification: preserved
    owner: composition
    evidence:
      - mise.toml
      - docs/mise-tasks.md
    reason: >-
      The redesign changed Go package boundaries only. No task was renamed,
      added, or removed, so every documented command still resolves.
    check: check:tasks (cmd/validate-mise-tasks) validates the names and references.

  - id: skill-trace-jsonl
    surface: The persisted skill-trace JSONL shape and its schema version.
    classification: preserved
    owner: evidence
    evidence:
      - workflow/skill-trace.schema.json
      - workflow/trace-fixtures
      - docs/skill-trace.md
    reason: >-
      Issue #329 moved the trace assembly into the evidence module and made
      DiagnosticRef an alias of evidence.DiagnosticRef. The JSON field names
      producer and code are unchanged, so the persisted shape is identical.
    check: validate-skill-trace inside check:repository validates the committed fixtures.

  - id: validator-diagnostic-jsonl
    surface: The validator-diagnostic JSONL shape, its codes, and its schema version.
    classification: preserved
    owner: evidence
    evidence:
      - workflow/validator-diagnostic.schema.json
      - workflow/diagnostic-fixtures
      - docs/validator-diagnostics.md
    reason: >-
      The diagnostic package now reads its credential, URL, and commit patterns
      from internal/evidence instead of declaring them inline. The patterns and
      the emitted fields are the same.
    check: validate-diagnostic inside check:repository validates the committed fixtures.

  - id: failure-record-jsonl
    surface: The failure-record JSONL shape and its promotion fields.
    classification: preserved
    owner: evidence
    evidence:
      - workflow/failure-record.schema.json
      - workflow/failure-records
      - docs/failure-promotion.md
    reason: The redesign did not touch the failure-record producer or its schema.
    check: check-promotion reads the records and fails on a shape it cannot parse.

  - id: skill-environment-json
    surface: The skill-environment report shape the environment provisioner emits.
    classification: preserved
    owner: evidence
    evidence:
      - workflow/skill-environment.schema.json
      - docs/skill-environment.md
    reason: >-
      Issue #330 routed the provisioner's git and worktrunk calls through
      provider ports. The reported fields and their meanings are unchanged.
    check: go test ./internal/environment/... covers the emitted report.

  - id: fsl-specifications
    surface: The FSL specification sources under specs/ and the skill-owned links into them.
    classification: preserved
    owner: domain
    evidence:
      - specs
      - docs/fsl.md
    reason: >-
      No specification source, state, or transition changed. The redesign
      changed how the verifier is started, not what it verifies.
    check: verify:fsl verifies 9 specifications.

  - id: fsl-verifier-failure-classification
    surface: >-
      How a caller learns that the pinned fslc verifier could not judge a
      specification.
    classification: changed
    owner: provider
    evidence:
      - internal/fsl/run.go
      - docs/fsl.md
    old: >-
      An absent verifier binary, an expired deadline, and an interrupted run
      surfaced through the same path as a verifier that ran and rejected the
      specification, so an environment fault read as an invalid specification.
    new: >-
      Only a verifier that ran and returned a status reports on the
      specification. Every other outcome is reported as a verifier
      infrastructure error.
    reason: >-
      Issue #330 gave every external call a failure kind. A specification that
      was never judged must not be reported as one that failed, because the two
      need different responses from the reader.
    confirmation: >-
      The requester confirmed this classification while planning Issue #331 and
      chose to record both landed behavior changes as changed.
    migration: >-
      A caller that treated any non-zero verifier result as an invalid
      specification now separates the two. No committed specification changes,
      and a successful verification is unaffected.
    compatibility: >-
      A passing run is byte-identical. Only a run in a broken or interrupted
      environment reports differently, and it reports more precisely than
      before.
    validation: >-
      internal/fsl/run_test.go exercises the absent, timed-out, and interrupted
      verifier against a provider stub, and verify:fsl passes on the committed
      specifications.

  - id: skill-graph
    surface: The skill graph data and its schema version.
    classification: preserved
    owner: domain
    evidence:
      - workflow/skill-graph.yml
      - docs/skill-graph.md
    reason: >-
      The graph package gained a module comment only. Its nodes, edges, and
      schema version are unchanged.
    check: validate-skill-graph inside check:repository validates 20 skills at schema version 1.

  - id: replay-fixtures
    surface: The replay fixture files and the outcome each one asserts.
    classification: preserved
    owner: evidence
    evidence:
      - workflow/replay-fixtures
    reason: >-
      No fixture was added, removed, or re-recorded, and each one still reports
      the outcome it recorded at the baseline.
    check: validate-replay-fixtures inside check:repository checks all 10 fixtures.

  - id: evidence-fixtures
    surface: >-
      The committed trace, diagnostic, context, and failure-record fixtures that
      pin the evidence formats.
    classification: preserved
    owner: evidence
    evidence:
      - workflow/trace-fixtures
      - workflow/diagnostic-fixtures
      - workflow/context-fixtures
      - workflow/failure-records
    reason: >-
      The redesign changed which package builds a trace, not what a trace
      contains. Every committed fixture still validates unchanged.
    check: check:repository validates the trace, diagnostic, and context fixtures.

  - id: skill-layout
    surface: >-
      The skills/<category>/<skill-name>/SKILL.md layout, the bare skill name
      used for installation, the catalog entry that publishes it, and the rule
      that every per-skill asset lives below its skill root except the
      evaluation scenarios and fixtures.
    classification: changed
    owner: domain
    evidence:
      - skills
      - CATALOG.yml
      - AGENTS.md
      - evaluations/README.md
    old: >-
      The repository stated no rule for where a per-skill asset lives.
      Evaluation scenarios sat in evaluations/scenarios/<skill-name>/ with no
      checked link to skills/, so a scenario directory named after a retired
      skill, a scenario filed under another skill's directory, or a catalog
      entry without a skill directory passed check-evaluation.
    new: >-
      AGENTS.md and evaluations/README.md state that every per-skill asset
      lives below its skill root and name the evaluation inputs, scenarios and
      fixtures, as the one exception. check-evaluation requires every scenario directory except e2e
      to name a cataloged skill, every scenario's skill field to equal its
      directory name, and every cataloged skill to resolve to
      skills/<category>/<skill-name>/SKILL.md.
    reason: >-
      Issue #346 found the scenarios to be the one per-skill asset with no
      link back to its skill. gh skill install copies the whole skill
      directory to every user and into the evaluation sandbox, so moving
      scenarios or fixtures below the skill root would ship them with the skill
      and show each scenario's expectations to the agent under evaluation; the
      checked scenario directory name is the link instead.
    confirmation: >-
      The requester selected keeping the scenarios central as a named
      exception, enforcing all three relationships, and recording skill-layout
      as changed while planning Issue #346, and extended the exception to the
      fixtures during review of Pull Request #355.
    migration: >-
      No file moves. A contributor who adds or renames a skill keeps its
      scenario directory name, each scenario's skill field, and its catalog
      entry equal to the skill directory name, which the committed corpus
      already does.
    compatibility: >-
      No skill moved, was renamed, or changed category, and the catalog still
      carries one entry per published skill. Installation output is unchanged.
      Only check-evaluation rejects trees it previously accepted.
    validation: >-
      validate-repository reports 20 skills and 20 catalog entries,
      check-evaluation still reports 77 scenarios for 20 cataloged skills, and
      internal/eval/corpus_test.go fails each broken relationship.

  - id: evaluation-corpus
    surface: The evaluation scenario files and the assertions they declare.
    classification: preserved
    owner: execution
    evidence:
      - evaluations/scenarios
      - docs/evaluation.md
    reason: >-
      Issue #329 moved evaluation trace assembly into the evidence module
      behind an unchanged scenario format, so every committed scenario still
      parses and asserts as before.
    check: >-
      check-evaluation reports 77 scenarios for 20 cataloged skills and checks
      that every scenario directory, skill field, and cataloged skill resolves
      to a skill under skills/.

  - id: execution-policy-files
    surface: >-
      The deliberation policy and the execution strategy policy, their schema
      versions, and the strategy names they declare.
    classification: preserved
    owner: policy
    evidence:
      - workflow/deliberation-policy.yml
      - workflow/execution-strategy-policy.yml
      - docs/execution-strategy.md
    reason: >-
      The strategy package gained a module comment only. The declared signals,
      patterns, strategies, and rules are unchanged.
    check: validate-deliberation-policy and validate-execution-strategy inside check:repository.

  - id: evidence-redaction
    surface: >-
      The redaction rules that keep a credential, a private URL, and a user path
      out of persisted evidence and diagnostics.
    classification: preserved
    owner: evidence
    evidence:
      - internal/redact/redact.go
      - docs/security.md
    reason: >-
      Issue #329 moved the credential, URL, and commit patterns into
      internal/evidence so one definition serves every producer. Issue #343
      moved the same rules again, into internal/redact, so the packages that
      cannot import the evidence module read them too, and added
      IsPrivateHost. Every change tightened a rule: a unique local IPv6 host, a
      link local unicast host, and an uppercase URL scheme are now redacted
      where they were not. No rule was relaxed.
    check: >-
      check-sensitive-content inside check:repository, plus
      TestSensitiveFixtureValuesNeverReachPersistedJSON and
      TestErrorMessageNeverCarriesACredential.
