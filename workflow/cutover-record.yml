schema_version: 1

# The coordinated cutover for the redesign Issue #326 and its Sub-issue #332.
# docs/architecture.md records the reasoning; this file is the machine-readable
# source the check-cutover-record repository check enforces.
#
# baseline is the measured commit the architecture record starts from.
# cutover_point is the single commit at which the selected boundary model and
# every approved contract change are active.
#
# order lists the Sub-issues in the sequence their work had to land. A
# depends_on entry must name an Issue that appears earlier in the list.
#
# participants is the readiness and recovery matrix. Every component, consumer,
# schema, fixture, workflow, and document the cutover touches is one row, and
# every contract in workflow/contract-decisions.yml is covered by at least one
# row.
#
# No field may name a version identifier such as v1 or v2. Issue #326 allows one
# only after a separate recorded decision, and this cutover records none.

baseline: 4cce0641bbc9bc28c9bba47522a6071b0acded69
cutover_point: 9f04db42a68e5140e4dc4067a42fdc8b02b230f0

order:
  - issue: 328
    delivers: >-
      Internal module ownership and dependency direction, recorded in
      workflow/module-ownership.yml and enforced by check-module-boundaries.
    depends_on: []
  - issue: 329
    delivers: >-
      The typed evidence and reporting boundary: the internal/evidence package
      and the trace.RunResult input an execution module fills.
    depends_on:
      - 328
  - issue: 330
    delivers: >-
      Provider ports and adapters in internal/provider, with one failure
      classification for every external process and network request.
    depends_on:
      - 328
      - 329
  - issue: 331
    delivers: >-
      The contract decisions in workflow/contract-decisions.yml and the
      check-contract-decisions repository check that enforces them.
    depends_on:
      - 328
      - 329
      - 330

participants:
  - id: module-foundation
    kind: module
    surface: Shared primitives and skill discovery every other module imports.
    owner: foundation
    contracts: []
    evidence:
      - internal/discover
      - internal/hooks
      - internal/support
    readiness: >-
      The foundation module imports no other internal module, so nothing below
      it can hold a reverse dependency at the cutover point.
    readiness_check: go run ./cmd/check-repository
    recovery: >-
      Reverting the redesign range restores the pre-split package set; the
      foundation packages keep their paths, so no caller changes.

  - id: module-provider
    kind: module
    surface: Ports and adapters for every external process and network request.
    owner: provider
    contracts:
      - fsl-verifier-failure-classification
    evidence:
      - internal/provider
    readiness: >-
      No package outside internal/provider imports os/exec or net/http, apart
      from the internal/support exemption the boundary check names.
    readiness_check: go run ./cmd/check-repository
    recovery: >-
      Reverting the range returns the five ad-hoc runner interfaces and the
      direct calls; the FSL verifier then reports an environment fault as an
      invalid specification again, which the trigger table treats as expected
      after recovery.

  - id: module-domain
    kind: module
    surface: Skill domain data read from the repository tree.
    owner: domain
    contracts:
      - skill-graph
      - skill-layout
    evidence:
      - internal/graph
      - internal/instructions
    readiness: >-
      The skill graph and the instruction inventory build from the committed
      tree without a network request.
    readiness_check: go run ./cmd/validate-skill-graph
    recovery: >-
      The domain packages keep their paths and their data, so reverting changes
      neither the graph nor the inventory.

  - id: module-policy
    kind: module
    surface: Deliberation, environment, and execution-strategy decisions.
    owner: policy
    contracts:
      - execution-policy-files
    evidence:
      - internal/context
      - internal/deliberation
      - internal/environment
      - internal/strategy
    readiness: >-
      The committed deliberation and execution-strategy policies validate, and
      the strategy selection reports an unavailable host capability as an
      unavailable environment.
    readiness_check: go run ./cmd/validate-execution-strategy
    recovery: >-
      The policy files are unchanged across the range, so reverting restores
      only the call sites that reach the provider ports.

  - id: module-evidence
    kind: module
    surface: Traces, diagnostics, replays, badges, and the public status report.
    owner: evidence
    contracts:
      - skill-trace-jsonl
      - validator-diagnostic-jsonl
      - failure-record-jsonl
      - skill-environment-json
      - evidence-redaction
    evidence:
      - internal/badges
      - internal/diagnostic
      - internal/evidence
      - internal/publicstatus
      - internal/replay
      - internal/trace
    readiness: >-
      Every committed trace and diagnostic validates, and the redaction rules
      keep a credential, a private address, and a user path out of the written
      evidence.
    readiness_check: go run ./cmd/check-repository
    recovery: >-
      Reverting removes internal/evidence and returns the duplicated primitives
      to internal/trace and internal/diagnostic. No persisted shape changes, so
      every committed artifact stays readable.

  - id: module-execution
    kind: module
    surface: Workflow execution and release assembly.
    owner: execution
    contracts:
      - evaluation-corpus
    evidence:
      - internal/eval
      - internal/release
    readiness: >-
      The evaluation corpus passes its assertions and an evaluation run writes
      its trace through the typed input rather than assembling persisted fields
      itself.
    readiness_check: go run ./cmd/check-evaluation
    recovery: >-
      Reverting restores the 128-line assembly in internal/eval/trace.go. The
      written trace stays byte-identical, which the recorded golden comparison
      in internal/trace/testdata/evaluation-run-traces.json observes.

  - id: module-governance
    kind: module
    surface: Repository checks and validation of committed artifacts.
    owner: governance
    contracts: []
    evidence:
      - internal/check
      - internal/commitlint
      - internal/fsl
      - internal/govuln
      - internal/project
      - internal/validate
    readiness: >-
      Every repository check runs and the aggregate command reports the total
      the architecture record names.
    readiness_check: go run ./cmd/check-repository
    recovery: >-
      Reverting removes check-module-boundaries, check-contract-decisions, and
      check-cutover-record, and the aggregate total returns to 21. The three
      records they enforce are removed by the same revert.

  - id: command-surface
    kind: command
    surface: The command names and flags of every program under cmd/.
    owner: composition
    contracts:
      - cli-command-names
      - repository-check-list
    evidence:
      - cmd
      - SCRIPT_TESTS.toml
    readiness: >-
      No command was renamed, added, or removed across the range, and every
      command the script-test map names still resolves.
    readiness_check: go run ./cmd/validate-script-tests
    recovery: >-
      Reverting removes no command, because the range added none. A consumer
      asserting the repository check total sets it back to 21.

  - id: mise-tasks
    kind: workflow
    surface: The task names mise.toml defines and the checks they compose.
    owner: composition
    contracts:
      - mise-task-names
    evidence:
      - mise.toml
    readiness: >-
      Every task name the documentation and the workflows call exists, and
      validate:all composes the checks the validation tiers describe.
    readiness_check: go run ./cmd/validate-mise-tasks
    recovery: >-
      mise.toml is unchanged across the range, so reverting leaves every task
      name and every dependency list as it is.

  - id: continuous-integration
    kind: workflow
    surface: The GitHub Actions workflows that run the repository validations.
    owner: composition
    contracts: []
    evidence:
      - .github/workflows
    readiness: >-
      The Validate workflow runs the same aggregate task a local run uses, so a
      check added to cmd/check-repository reaches continuous integration
      without a workflow edit.
    readiness_check: go run ./cmd/check-repository
    recovery: >-
      No workflow file changes across the range, so a revert needs no workflow
      edit and the next run reports the reverted totals.

  - id: fsl-specifications
    kind: schema
    surface: The specification sources under specs/ and their verification.
    owner: domain
    contracts:
      - fsl-specifications
    evidence:
      - specs
    readiness: >-
      Every committed specification verifies with the pinned verifier, and an
      absent verifier is reported as a verifier infrastructure error rather
      than an invalid specification.
    readiness_check: mise run verify:fsl
    recovery: >-
      No specification source changes across the range. Reverting restores the
      earlier classification, in which an absent or interrupted verifier reads
      as an invalid specification.

  - id: evidence-schemas
    kind: schema
    surface: The persisted JSONL and JSON shapes the evidence producers write.
    owner: evidence
    contracts:
      - skill-trace-jsonl
      - validator-diagnostic-jsonl
      - failure-record-jsonl
      - skill-environment-json
    evidence:
      - workflow/skill-trace.schema.json
      - workflow/validator-diagnostic.schema.json
      - workflow/failure-record.schema.json
      - workflow/skill-environment.schema.json
    readiness: >-
      No schema file changes across the range, and a reader rejects an unknown
      field instead of dropping it.
    readiness_check: go run ./cmd/check-repository
    recovery: >-
      The schema files are untouched, so a revert leaves every persisted
      artifact valid against the same shapes.

  - id: skill-graph-data
    kind: consumer
    surface: The committed skill graph and the readers that consume it.
    owner: domain
    contracts:
      - skill-graph
    evidence:
      - workflow/skill-graph.yml
    readiness: >-
      The committed graph matches the tree and its schema version is unchanged.
    readiness_check: go run ./cmd/validate-skill-graph
    recovery: >-
      The graph data is unchanged across the range, so reverting changes no
      node, edge, or schema version.

  - id: replay-consumers
    kind: consumer
    surface: The replay fixtures and the outcome each one asserts.
    owner: evidence
    contracts:
      - replay-fixtures
    evidence:
      - workflow/replay-fixtures
    readiness: >-
      Every replay fixture returns the outcome its manifest records, and two
      runs over the same fixture return the same outcome.
    readiness_check: go run ./cmd/check-repository
    recovery: >-
      The fixtures and the manifest are unchanged, so a reverted tree returns
      the same outcome for each one.

  - id: evidence-fixtures
    kind: fixture
    surface: The committed trace, diagnostic, context, and failure-record fixtures.
    owner: evidence
    contracts:
      - evidence-fixtures
    evidence:
      - workflow/trace-fixtures
      - workflow/diagnostic-fixtures
      - workflow/context-fixtures
      - workflow/failure-records
    readiness: >-
      Every committed fixture parses and keeps the outcome it was captured to
      demonstrate, including the interrupted and missing-evidence cases.
    readiness_check: go run ./cmd/check-repository
    recovery: >-
      No fixture changes across the range, so a revert needs no fixture
      recapture.

  - id: execution-policies
    kind: fixture
    surface: The deliberation and execution-strategy policy files.
    owner: policy
    contracts:
      - execution-policy-files
    evidence:
      - workflow/deliberation-policy.yml
      - workflow/execution-strategy-policy.yml
    readiness: >-
      Both policy files validate and neither gained nor lost a rule across the
      range.
    readiness_check: go run ./cmd/validate-deliberation-policy
    recovery: >-
      The policy files are unchanged, so reverting restores only the code that
      reads them.

  - id: published-skills
    kind: consumer
    surface: The published skill layout and its catalog entries.
    owner: domain
    contracts:
      - skill-layout
    evidence:
      - skills
      - CATALOG.yml
    readiness: >-
      Every published skill keeps its skills/<category>/<skill-name>/SKILL.md
      path and its catalog entry, and no skill path changed across the range.
    readiness_check: go run ./cmd/check-repository
    recovery: >-
      No skill file changes across the range, so a revert leaves every
      installed skill resolvable at the same path.

  - id: evaluation-reports
    kind: consumer
    surface: The evaluation scenarios, their assertions, and the reports they produce.
    owner: execution
    contracts:
      - evaluation-corpus
    evidence:
      - evaluations
    readiness: >-
      Every scenario passes its assertions and the report keeps the fields its
      readers consume.
    readiness_check: go run ./cmd/check-evaluation
    recovery: >-
      The corpus is unchanged across the range, so a reverted run produces the
      same scenario results.

  - id: architecture-record
    kind: document
    surface: >-
      The architecture record and the two machine-readable files it explains.
    owner: composition
    contracts:
      - repository-check-list
    evidence:
      - docs/architecture.md
      - docs/validation-tiers.md
      - workflow/module-ownership.yml
      - workflow/contract-decisions.yml
    readiness: >-
      The record describes every module, every contract, and every participant
      this file names, and the check totals it prints match the aggregate
      command.
    readiness_check: go run ./cmd/check-repository
    recovery: >-
      Reverting removes the record and both machine-readable files together, so
      no document is left describing a boundary the tree no longer has.

recovery:
  safe_state: >-
    The measured baseline commit, reached by reverting the redesign commit
    range on a new branch. Published history is never rewritten.
  method: revert
  triggers:
    - id: readiness-unmet
      condition: A readiness condition in this file fails at the cutover point.
      action: >-
        Stop before recording the cutover point, run the revert steps, and
        report the failing condition with the command output.
    - id: post-cutover-check-fails
      condition: A post-cutover check fails after the cutover point.
      action: >-
        Run the revert steps, confirm the reverted tree passes the same check,
        and report both results before any further change.
    - id: contract-drift
      condition: >-
        check-contract-decisions or check-cutover-record reports a surface the
        record does not describe.
      action: >-
        Reconcile the record when the tree is correct; run the revert steps
        when the tree is not.
  steps:
    - id: create-recovery-branch
      action: Create a branch from the cutover point for the revert commits.
      observation: The branch resolves and the working tree is clean.
    - id: revert-range
      action: >-
        Revert the redesign commit range from the cutover point back to the
        baseline, keeping one revert commit per reverted commit.
      observation: Every revert applies without a conflict marker in the tree.
    - id: build-reverted-tree
      action: Build every package of the reverted tree.
      observation: go build ./... exits zero.
    - id: test-reverted-tree
      action: Run the tests of the reverted tree.
      observation: go test ./... exits zero.
    - id: check-reverted-tree
      action: Run the repository checks on the reverted tree.
      observation: >-
        go run ./cmd/check-repository reports the baseline total of 21 checks
        and exits zero.
    - id: report-recovery
      action: >-
        Report the reverted state, the commands, and their results, and open
        the recovery Pull Request through the ordinary review path.
      observation: The report names every command and its exit status.
  rehearsal:
    - command: git worktree add --detach
      observation: >-
        The rehearsal ran in a throwaway worktree checked out at the cutover
        point, so the branch under review and the published history stayed
        untouched.
    - command: git revert --no-commit
      observation: >-
        All 20 commits of the redesign range reverted without a conflict, and
        git diff --stat against the baseline reported no difference, so the
        reverted tree is the baseline tree.
    - command: go build ./...
      observation: The reverted tree built, exit status 0.
    - command: go test ./...
      observation: The reverted tree passed, exit status 0, 30 packages ok.
    - command: go run ./cmd/check-repository
      observation: >-
        The reverted tree reported "all 21 repository checks passed" and exited
        zero, which is the baseline total.

post_cutover:
  - id: public-command-behavior
    aspect: public-behavior
    command: go run ./cmd/check-repository
    observation: >-
      Every named check runs and the final line reports the total the
      architecture record states.
  - id: command-name-stability
    aspect: public-behavior
    command: go run ./cmd/validate-script-tests
    observation: >-
      Every command the script-test map names resolves, so no command name or
      flag changed across the cutover.
  - id: evidence-privacy
    aspect: privacy
    command: go run ./cmd/check-sensitive-content
    observation: >-
      No credential, private address, or user path reaches a committed
      artifact or a written diagnostic.
  - id: mutation-authority
    aspect: authority
    command: go run ./cmd/check-analyze-readonly
    observation: >-
      A read-only skill performs no repository mutation, so the cutover moved
      no write authority into an analysis path.
  - id: provider-failure-classification
    aspect: provider-failure
    command: go test ./internal/provider/
    observation: >-
      Provider success, failure, timeout, interruption, unavailable capability,
      and retry exhaustion each keep their own classification.
  - id: verifier-infrastructure-failure
    aspect: provider-failure
    command: go test ./internal/fsl/
    observation: >-
      An absent, timed-out, or interrupted verifier is reported as a verifier
      infrastructure error rather than an invalid specification.
  - id: terminal-outcomes
    aspect: terminal-outcome
    command: go test ./internal/trace/
    observation: >-
      The pass, fail, skipped, interrupted, and infrastructure-error outcomes
      stay separate in the written trace.
  - id: deterministic-replay
    aspect: deterministic-replay
    command: go test ./internal/replay/
    observation: >-
      Every replay fixture returns the outcome its manifest records, and a
      second run returns the same outcome.
  - id: specification-verification
    aspect: compatibility
    command: mise run verify:fsl
    observation: >-
      Every committed specification verifies, or the run is classified as an
      unavailable environment when the pinned verifier is absent.
  - id: skill-graph-compatibility
    aspect: compatibility
    command: go run ./cmd/validate-skill-graph
    observation: The committed graph matches the tree and its schema version is unchanged.
  - id: evaluation-corpus-result
    aspect: compatibility
    command: go run ./cmd/check-evaluation
    observation: Every evaluation scenario passes its assertions.
  - id: aggregate-validation
    aspect: compatibility
    command: mise run validate:all
    observation: >-
      The aggregate validation exits zero, which is the condition the cutover
      record treats as the complete post-cutover result.
