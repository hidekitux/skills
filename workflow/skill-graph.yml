      required: false
      priority: 40
      activation:
        task_kinds: [documentation, process]
    - id: repository.backend
      category: repository_evidence
      source: docs/skill-contract.md
      required: false
      priority: 20
      activation:
        path_patterns: [internal/**, cmd/**]
    - id: repository.frontend
      category: repository_evidence
      source: docs/skill-contract.md
      required: false
      priority: 20
      activation:
        path_patterns: [frontend/**, web/**, ui/**]
    - id: repository.ci
