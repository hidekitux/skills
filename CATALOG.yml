# Inventory of skills published from this repository.
# Add one entry when adding a skill; keep the version aligned with its release.
# layer is one of: process, analyze, fix, govern (see docs/skill-layers.md).
# related lists related skills by name; it may include planned skills that are
# not yet published.
catalog_version: 1
license: Apache-2.0
skills:
  - name: plan-issue
    summary: Read a governed change issue and produce a verified implementation plan.
    owner: hidekitux
    status: experimental
    agents: [codex, claude-code]
    license: Apache-2.0
    version: 0.1.0
    layer: process
    related: [create-issue, implement-issue]
  - name: create-pr
    summary: Create validated, Issue-backed GitHub Pull Requests without duplicating existing work.
    owner: hidekitux
    status: experimental
    agents: [codex, claude-code]
    license: Apache-2.0
    version: 0.1.0
    layer: process
    related: [implement-issue, review-pr]
  - name: merge-pr
    summary: Merge approved, validated Pull Requests through protected-branch policy and verify linked work outcomes.
    owner: hidekitux
    status: experimental
    agents: [codex, claude-code]
    license: Apache-2.0
    version: 0.1.0
    layer: process
    related: [create-pr, review-pr]
  - name: create-issue
    summary: Create compliant GitHub change and release Issues before governed work.
    owner: hidekitux
    status: experimental
    agents: [codex, claude-code]
    license: Apache-2.0
    version: 0.1.0
    layer: process
    related: [plan-issue]
  - name: bootstrap-project
    summary: Initialize projects with PR-only protected branches, a runnable baseline, and proportionate FSL adoption.
    owner: hidekitux
    status: experimental
    agents: [codex, claude-code]
    host_adapters: [codex, claude-code]
    license: Apache-2.0
    version: 0.1.0
    layer: govern
    related: [audit-workflow-enforcement]
  - name: audit-workflow-enforcement
    summary: Audit mandatory repository rules with deterministic checks and bounded subagent review.
    owner: hidekitux
    status: experimental
    agents: [codex, claude-code]
    host_adapters: [codex, claude-code]
    license: Apache-2.0
    version: 0.1.0
    layer: govern
    related: [bootstrap-project]
  - name: implement-issue
    summary: Implement a governed Change Issue from its verified implementation plan with per-task evidence.
    owner: hidekitux
    status: experimental
    agents: [codex, claude-code]
    license: Apache-2.0
    version: 0.1.0
    layer: process
    related: [plan-issue, create-pr]
  - name: debug-code
    summary: Debug failures from reproduction through root cause, fix, and verification with evidence at every step.
    owner: hidekitux
    status: experimental
    agents: [codex, claude-code]
    license: Apache-2.0
    version: 0.1.0
    layer: fix
    related: [implement-issue, write-tests, refactor-code]
  - name: fix-pr
    summary: Fix review findings on an existing Pull Request and push the reviewed commit as its head.
    owner: hidekitux
    status: experimental
    agents: [codex, claude-code]
    license: Apache-2.0
    version: 0.1.0
    layer: process
    related: [review-pr, create-pr, merge-pr]
  - name: review-pr
    summary: Review pull requests for PR-introduced defects backed by concrete failure scenarios, ordered by severity.
    owner: hidekitux
    status: experimental
    agents: [codex, claude-code]
    license: Apache-2.0
    version: 0.1.0
    layer: process
    related: [create-pr, fix-pr]
  - name: analyze-project
    summary: Investigate a repository end to end and report prioritized, evidence-backed findings and improvement opportunities.
    owner: hidekitux
    status: experimental
    agents: [codex, claude-code]
    license: Apache-2.0
    version: 0.1.0
    layer: analyze
    related: [create-issue]
  - name: refactor-code
    summary: Perform small, behavior-preserving code refactorings verified against a test baseline.
    owner: hidekitux
    status: experimental
    agents: [codex, claude-code]
    license: Apache-2.0
    version: 0.1.0
    layer: fix
    related: [debug-code, write-tests, implement-issue]
  - name: write-tests
    summary: Design focused, proportionate tests with per-case failure evidence for a defined feature or fix.
    owner: hidekitux
    status: experimental
    agents: [codex, claude-code]
    license: Apache-2.0
    version: 0.1.0
    layer: fix
    related: [debug-code, implement-issue, refactor-code]
  - name: improve-project
    summary: Improve a project end to end from read-only analysis through an Issue-backed, reviewed change.
    owner: hidekitux
    status: experimental
    agents: [codex, claude-code]
    license: Apache-2.0
    version: 0.1.0
    layer: process
    related: [analyze-project, create-issue, plan-issue, implement-issue, create-pr, review-pr]
  - name: deliver-change
    summary: Deliver a governed Change Issue end to end from its verified plan through a reviewed Pull Request.
    owner: hidekitux
    status: experimental
    agents: [codex, claude-code]
    license: Apache-2.0
    version: 0.1.0
    layer: process
    related: [plan-issue, implement-issue, create-pr, review-pr]
  - name: resolve-defect
    summary: Resolve a verified defect from reproduction through fix, regression tests, and any required governed change.
    owner: hidekitux
    status: experimental
    agents: [codex, claude-code]
    license: Apache-2.0
    version: 0.1.0
    layer: fix
    related: [debug-code, write-tests, create-issue, plan-issue, implement-issue]

