name: Work item title

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: Validate work item title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - env:
          WORK_ITEM_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/validate-work-item-title.py --title "$WORK_ITEM_TITLE"
