# Representative test evidence for each executable repository script or
# command. Each entry names the Go test package and the test functions that
# exercise the command or script, and check:repository fails when a named test
# is not declared in that package. The check proves that the named test
# exists; reviewers still inspect that it exercises the changed behavior.
#
# The cmds table maps a cmd/ Go entrypoint, the scripts table maps a retained
# executable file under scripts/, and the skill_scripts table maps each file
# below skills/ whose path has a scripts/ directory at any depth. The Go tests
# for skill scripts run them with python3; the files under templates/ are
# copied into the projects that bootstrap-project generates.
[cmds]
"cmd/check-sensitive-content" = { package = "./internal/check", tests = ["TestSensitiveContentRejectsATokenAndPrivateURL"] }
"cmd/check-analyze-readonly" = { package = "./internal/check", tests = ["TestAnalyzeReadonlyRejectsIssueCreationInstruction"] }
"cmd/check-repository" = { package = "./cmd/check-repository", tests = ["TestRunReportsEveryCheckAndPasses"] }
"cmd/validate-script-tests" = { package = "./internal/validate", tests = ["TestScriptTestsPassesWithCompleteCoverage"] }
"cmd/validate-branch-policy" = { package = "./internal/validate", tests = ["TestBranchPolicyAcceptsDependabotRouteWithoutIssueLink"] }
"cmd/validate-pr-commit-signatures" = { package = "./internal/validate", tests = ["TestCheckPrCommitSignaturesRejectsMissingFixture"] }
"cmd/validate-issue-body" = { package = "./internal/validate", tests = ["TestIssueBodyAcceptsOrderedChangeBody"] }
"cmd/validate-issue-project" = { package = "./internal/project", tests = ["TestCheckIssueProjectAcceptsValidContract"] }
"cmd/validate-plan-comment" = { package = "./cmd/validate-plan-comment", tests = ["TestPlanCommentValidationContract"] }
"cmd/set-issue-project-status" = { package = "./internal/project", tests = ["TestSetIssueStatusRetriesItemEditWithoutRepeatingReads", "TestPullRequestStatusCoversAllEventPatterns"] }
"cmd/validate-work-item-title" = { package = "./internal/validate", tests = ["TestWorkItemTitleAcceptsSentenceCaseWithProperNouns"] }
"cmd/validate-hosts" = { package = "./internal/validate", tests = ["TestHostsDiagnosticsPreserveDetailedOutput"] }
"cmd/validate-mise-tasks" = { package = "./cmd/validate-mise-tasks", tests = ["TestValidateRejectsRetiredReference"] }
"cmd/validate-commit-message" = { package = "./internal/commitlint", tests = ["TestValidateMessageAcceptsSingleLineWithIssue"] }
"cmd/lint-commits" = { package = "./internal/commitlint", tests = ["TestLintCommitsLintsPRRangeAndExitsZero"] }
"cmd/check-whitespace" = { package = "./internal/check", tests = ["TestCheckWhitespacePassesOnCleanCommit"] }
"cmd/test-go" = { package = "./internal/check", tests = ["TestRunGoTestsWithSentinel"] }
"cmd/collect-badges" = { package = "./internal/badges", tests = ["TestCollectBadgesAcceptsMultilineMutationLog"] }
"cmd/verify-fsl" = { package = "./internal/fsl", tests = ["TestVerifyFSLResultDistinguishesInvalidSpecFromUnavailableTool"] }
"cmd/mutate-fsl" = { package = "./internal/fsl", tests = ["TestMutateFSLResultRetainsReportWhenMutationOutputIsInvalid"] }
"cmd/verify-release" = { package = "./internal/release", tests = ["TestVerifyReleaseUsesCommandAdapter"] }
"cmd/publish-release" = { package = "./internal/release", tests = ["TestPublishReleaseUsesCommandAdapter"] }
"cmd/scan-go-vuln" = { package = "./internal/govuln", tests = ["TestScanDefaultPatternsInvokesPinnedJSONMode"] }
"cmd/validate-skill-creator" = { package = "./internal/validate", tests = ["TestValidateSkillCreatorReportsMissingValidatorWithoutRunningExternalTool"] }
"cmd/validate-skill-graph" = { package = "./internal/graph", tests = ["TestValidateCurrentGraph"] }
"cmd/read-skill-graph" = { package = "./internal/graph", tests = ["TestIssue175EntrypointsUseGraphRoutes"] }
"cmd/validate-skill-trace" = { package = "./internal/trace", tests = ["TestValidateJSONLRejectsTrailingData"] }
"cmd/read-skill-trace" = { package = "./internal/trace", tests = ["TestWriteAndReadJSONL"] }
"cmd/replay-skill-trace" = { package = "./cmd/replay-skill-trace", tests = ["TestCommandReportIncludesFSLConformance"] }
"cmd/validate-diagnostic" = { package = "./cmd/validate-diagnostic", tests = ["TestDiagnosticValidationReportAcceptsValidJSONL"] }
"cmd/evaluate" = { package = "./internal/eval", tests = ["TestRunAggregateReturnsExpectedExitCodes"] }
"cmd/evaluate-compaction" = { package = "./cmd/evaluate-compaction", tests = ["TestCompactionCommandUsesPairedReportContract"] }
"cmd/measure-instructions" = { package = "./cmd/measure-instructions", tests = ["TestMeasurementUsesPinnedTokenizer"] }
"cmd/check-evaluation" = { package = "./internal/eval", tests = ["TestCheckCorpusPassesCompleteCorpus"] }
"cmd/check-promotion" = { package = "./internal/eval", tests = ["TestCheckPromotionReportsExitStatusAndSummary"] }
"cmd/compile-context" = { package = "./internal/context", tests = ["TestCompileSelectsOnlyActivatedModules"] }
"cmd/validate-deliberation-policy" = { package = "./internal/deliberation", tests = ["TestCurrentPolicyCheckReportsCoverage"] }
"cmd/select-execution-strategy" = { package = "./internal/strategy", tests = ["TestSelectsDeterministicallyForRepresentativeSignals"] }
"cmd/validate-execution-strategy" = { package = "./internal/strategy", tests = ["TestCurrentPolicyIsValid"] }
"cmd/generate-public-status" = { package = "./internal/publicstatus", tests = ["TestWriteInsertsBlockAndIsIdempotent"] }

[scripts]
"scripts/fsl/install-fslc.sh" = { package = "./internal/fsl", tests = ["TestBinPathPrefersFSLCBinDir"] }
"scripts/setup/environment-state.sh" = { package = "./internal/fsl", tests = ["TestBinPathReadsEnvironmentState"] }
"scripts/setup/register-local-skills.sh" = { package = "./internal/hooks", tests = ["TestRegisterLocalSkillsDiscoversNestedSkillsRecursively"] }
"scripts/setup/setup-commitlint.sh" = { package = "./internal/hooks", tests = ["TestSetupCommitlintPreparesOnlyTheLocalCommitlint"] }
"scripts/setup/setup-all.sh" = { package = "./internal/hooks", tests = ["TestSetupAllRunsBootstrapBeforeRefresh"] }
"scripts/setup/setup-bootstrap.sh" = { package = "./internal/hooks", tests = ["TestSetupAllRunsBootstrapBeforeRefresh"] }
"scripts/setup/setup-environment.sh" = { package = "./internal/hooks", tests = ["TestSetupEnvironmentExportsCIPathsWithoutGeneratingMiseConfig"] }
"scripts/setup/setup-refresh.sh" = { package = "./internal/hooks", tests = ["TestSetupAllRunsBootstrapBeforeRefresh"] }
"scripts/setup/setup-state.sh" = { package = "./internal/hooks", tests = ["TestSetupStateProvidesAtomicStateHelpers"] }
"scripts/setup/setup-validator.sh" = { package = "./internal/hooks", tests = ["TestSetupValidatorBuildsAndLinksTheRevisionValidator"] }
"scripts/setup/run-mise.sh" = { package = "./internal/hooks", tests = ["TestPostCheckoutOnlyRefreshesSetupOnBranchCheckouts"] }

[skill_scripts]
"skills/govern/bootstrap-project/scripts/configure-github-ruleset.py" = { package = "./internal/check", tests = ["TestConfigureRulesetDryRunPrintsPayloadWithoutCallingGH", "TestConfigureRulesetRejectsInvalidArguments", "TestConfigureRulesetApplyCreatesAndVerifiesRuleset", "TestConfigureRulesetApplyUpdatesRulesetAndRemovesDeprecatedOne"] }
"skills/govern/bootstrap-project/templates/github/scripts/validate-commit-message.py" = { package = "./internal/check", tests = ["TestCommitMessageScriptAcceptsSingleHeaderWithIssue", "TestCommitMessageScriptRejectsEachMessageClass"] }
"skills/govern/bootstrap-project/templates/github/scripts/validate-work-item-title.py" = { package = "./internal/check", tests = ["TestWorkItemTitleScriptAcceptsStandardAndReleaseTitles", "TestWorkItemTitleScriptRejectsEachTitleClass"] }
