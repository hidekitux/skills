# Representative test evidence for each executable repository script. This
# mapping proves that an added script has an intentional test home; reviewers
# still inspect whether that test exercises the changed behavior.
[scripts]
"scripts/check/check-sensitive-content.py" = "tests/test_policy_checks.py"
"scripts/check/check-tool-licenses.py" = "tests/test_policy_checks.py"
"scripts/check/check-whitespace.sh" = "tests/test_local_setup.py"
"scripts/fsl/install-fslc.sh" = "tests/test_validation_state_isolation.py"
"scripts/fsl/mutate-fsl.sh" = "tests/test_validation_state_isolation.py"
"scripts/fsl/verify-fsl.sh" = "tests/test_validation_state_isolation.py"
"scripts/lint/lint-commits.sh" = "tests/test_local_setup.py"
"scripts/lint/validate-commit-message.py" = "tests/test_local_setup.py"
"scripts/release/publish-release.sh" = "tests/test_publish_release.py"
"scripts/release/verify-release.py" = "tests/test_publish_release.py"
"scripts/setup/register-local-skills.sh" = "tests/test_local_setup.py"
"scripts/setup/setup-commitlint.sh" = "tests/test_local_setup.py"
"scripts/setup/setup-local-skills.sh" = "tests/test_local_setup.py"
"scripts/validate/validate-branch-policy.py" = "tests/test_validate_work_item_bodies.py"
"scripts/validate/validate-hosts.sh" = "tests/test_local_setup.py"
"scripts/validate/validate-issue-body.py" = "tests/test_validate_work_item_bodies.py"
"scripts/validate/validate-pr-commit-signatures.py" = "tests/test_validate_pr_commit_signatures.py"
"scripts/validate/validate-repository.py" = "tests/test_policy_checks.py"
"scripts/validate/validate-script-tests.py" = "tests/test_policy_checks.py"
"scripts/validate/validate-work-item-title.py" = "tests/test_validate_work_item_bodies.py"
