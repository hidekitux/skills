"scripts/lint-commits.sh" = "tests/test_local_setup.py"
"scripts/mutate-fsl.sh" = "tests/test_validation_state_isolation.py"
"scripts/publish-release.sh" = "tests/test_publish_release.py"
"scripts/register-local-skills.sh" = "tests/test_local_setup.py"
"scripts/setup-commitlint.sh" = "tests/test_local_setup.py"
"scripts/setup-local-skills.sh" = "tests/test_local_setup.py"
"scripts/validate-branch-policy.py" = "tests/test_validate_work_item_bodies.py"
"scripts/validate-hosts.sh" = "tests/test_local_setup.py"
"scripts/validate-issue-body.py" = "tests/test_validate_work_item_bodies.py"
"scripts/validate-pr-commit-signatures.py" = "tests/test_validate_pr_commit_signatures.py"
"scripts/validate-repository.py" = "tests/test_policy_checks.py"
