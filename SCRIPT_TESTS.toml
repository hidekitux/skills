# Representative test evidence for each executable repository script or
# command. This mapping proves that an added command or script has an
# intentional test home; reviewers still inspect whether that test exercises
# the changed behavior.
#
# The cmds table maps a cmd/ Go entrypoint to a Go test package directory.
# The scripts table maps a retained executable file under scripts/ to an
# existing test home (a test file or a Go test package).
[cmds]
"cmd/check-sensitive-content" = "./internal/check"
"cmd/check-tool-licenses" = "./internal/check"
"cmd/check-mutation-badges" = "./internal/check"
"cmd/check-analyze-readonly" = "./internal/check"
"cmd/check-repository" = "./cmd/check-repository"
"cmd/validate-repository" = "./internal/validate"
"cmd/validate-script-tests" = "./internal/validate"
"cmd/validate-branch-policy" = "./internal/validate"
"cmd/validate-pr-commit-signatures" = "./internal/validate"
"cmd/validate-issue-body" = "./internal/validate"
"cmd/validate-issue-project" = "./internal/project"
"cmd/validate-plan-comment" = "./cmd/validate-plan-comment"
"cmd/set-issue-project-status" = "./internal/project"
"cmd/backfill-issue-project" = "./internal/project"
"cmd/validate-work-item-title" = "./internal/validate"
"cmd/validate-hosts" = "./internal/validate"
"cmd/validate-mise-tasks" = "./cmd/validate-mise-tasks"
"cmd/validate-commit-message" = "./internal/commitlint"
"cmd/lint-commits" = "./internal/commitlint"
"cmd/check-whitespace" = "./internal/check"
"cmd/collect-badges" = "./internal/badges"
"cmd/verify-fsl" = "./internal/fsl"
"cmd/mutate-fsl" = "./internal/fsl"
"cmd/verify-release" = "./internal/release"
"cmd/publish-release" = "./internal/release"
"cmd/scan-go-vuln" = "./internal/govuln"
"cmd/validate-skill-creator" = "./internal/validate"
"cmd/evaluate" = "./internal/eval"
"cmd/check-evaluation" = "./internal/eval"
"cmd/generate-public-status" = "./internal/publicstatus"

[scripts]
"scripts/fsl/install-fslc.sh" = "./internal/fsl"
"scripts/setup/register-local-skills.sh" = "./internal/hooks"
"scripts/setup/setup-commitlint.sh" = "./internal/hooks"
"scripts/setup/setup-local-skills.sh" = "./internal/hooks"
