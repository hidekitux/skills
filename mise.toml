# Keep the validation runtime and GitHub CLI reproducible across supported local use and CI.
# These pinned tools are used only for development and CI; they are not bundled
# into published skills.

[tools]
python = "3.11.14"
uv = "0.11.1"
go = "1.26.5"
actionlint = "1.7.12"
"aqua:astral-sh/ruff" = "0.16.0"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:cli/cli" = "2.97.0"

[tasks.validate]
description = "Run supported-platform repository validations"
depends = ["check:repository", "check:skills", "check:hosts", "verify-fsl", "lint:actions", "lint:python", "lint:shell", "test", "check:diff", "check:branch-policy"]

[tasks.setup]
description = "Prepare local skills, Git hooks, and commitlint for development"
depends = ["setup:local-skills", "setup:commitlint"]

[tasks."check:local"]
description = "Check repository metadata, branch policy, and whitespace"
depends = ["check:repository", "check:branch-policy", "check:diff"]

[tasks."worktree:diagnose"]
description = "Report worktree branch ownership, setup state, and safe remediation"
run = "python scripts/diagnose/diagnose-worktree.py \"$@\""

[tasks.lint]
description = "Lint GitHub Actions, Python, and shell sources"
depends = ["lint:actions", "lint:python", "lint:shell"]

[tasks."check:hosts"]
description = "Validate local installation for Codex and Claude Code"
run = "bash scripts/validate/validate-hosts.sh"

[tasks.verify-fsl]
description = "Check and verify every FSL specification"
depends = ["fsl:install"]
run = "bash scripts/fsl/verify-fsl.sh"

[tasks."fsl:install"]
description = "Install the pinned FSL verifier with checksum verification"
run = "bash scripts/fsl/install-fslc.sh"

[tasks.mutate-fsl]
description = "Measure mutation detection for every FSL specification"
depends = ["fsl:install"]
run = "bash scripts/fsl/mutate-fsl.sh"

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows"
run = "actionlint"

[tasks."lint:python"]
description = "Lint and format-check Python scripts"
run = "RUFF_CACHE_DIR=\"${RUNNER_TEMP:-${TMPDIR:-/tmp}}/skills-ruff-cache\" ruff check scripts skills tests && RUFF_CACHE_DIR=\"${RUNNER_TEMP:-${TMPDIR:-/tmp}}/skills-ruff-cache\" ruff format --check scripts skills tests"

[tasks.test]
description = "Run repository unit tests"
run = "python -m unittest discover -s tests"

[tasks."lint:shell"]
description = "Lint Bash and POSIX shell scripts"
run = '''
find scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck --shell=bash
shellcheck --shell=sh .githooks/commit-msg
shellcheck --shell=sh .githooks/post-checkout
shellcheck --shell=sh .githooks/pre-commit
shellcheck --shell=sh .githooks/pre-push
'''

[tasks."setup:commitlint"]
description = "Install the project-local commitlint binary"
run = "bash scripts/setup/setup-commitlint.sh"

[tasks."setup:local-skills"]
description = "Enable local Git hooks and register repository skills for Codex and Claude Code"
run = "bash scripts/setup/setup-local-skills.sh"

[tasks."check:skills"]
description = "Validate publishable Agent Skills"
run = "gh skill publish --dry-run"

[tasks.verify-release]
description = "Verify a release tag matches the catalog and committed state"
run = '''
export UV_CACHE_DIR="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/skills-verify-release-uv-cache"
uv run --with "pyyaml==6.0.3" python scripts/release/verify-release.py "$@"
'''

[tasks."release:publish"]
description = "Run release gates, then publish a verified release tag"
run = "bash scripts/release/publish-release.sh \"$@\""

[tasks."check:repository"]
description = "Validate repository policy, sensitive content, licenses, and test evidence"
run = '''
export UV_CACHE_DIR="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/skills-validate-repository-uv-cache"
uv run --with "pyyaml==6.0.3" python scripts/validate/validate-repository.py
uv run --with "pyyaml==6.0.3" python scripts/check/check-tool-licenses.py
uv run --with "pyyaml==6.0.3" python scripts/validate/validate-script-tests.py
python scripts/check/check-sensitive-content.py
python scripts/check/check-mutation-badges.py
'''

[tasks."check:diff"]
description = "Reject whitespace errors in local changes and the committed CI diff"
run = "bash scripts/check/check-whitespace.sh"

[tasks."check:branch-policy"]
description = "Validate the repository pull-request branch policy configuration"
run = "python scripts/validate/validate-branch-policy.py --validate-config"

[tasks.validate-skill-creator]
description = "Validate every published skill with Codex skill-creator"
run = '''
skill_creator_root="${SKILL_CREATOR_ROOT:-${CODEX_HOME:-$HOME/.codex}/skills/.system/skill-creator}"
test -f "$skill_creator_root/scripts/quick_validate.py" || {
  echo "skill-creator validator not found; set SKILL_CREATOR_ROOT to its skill directory." >&2
  exit 2
}
export UV_CACHE_DIR="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/skills-validate-skill-creator-uv-cache"
find skills -type f -name SKILL.md -print0 |
  while IFS= read -r -d '' skill_file; do
    uv run --with "pyyaml==6.0.3" python \
      "$skill_creator_root/scripts/quick_validate.py" "$(dirname "$skill_file")"
  done
'''
