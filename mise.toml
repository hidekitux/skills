# Keep the validation runtime and GitHub CLI reproducible across supported local use and CI.
# These pinned tools are used only for development and CI; they are not bundled
# into published skills.

[tools]
go = "1.26.5"
actionlint = "1.7.12"
"aqua:astral-sh/ruff" = "0.16.0"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:cli/cli" = "2.97.0"
"aqua:google-antigravity/antigravity-cli" = "1.1.19"
"aqua:anomalyco/opencode" = "1.18.22"

[tasks.validate]
description = "Run supported-platform repository validations"
depends = ["check:repository", "check:skills", "check:hosts", "verify-fsl", "lint:actions", "lint:python", "lint:shell", "lint:go", "test", "check:diff", "check:branch-policy"]

[tasks.setup]
description = "Prepare local skills, Git hooks, and commitlint for development"
depends = ["setup:local-skills", "setup:commitlint"]

[tasks."check:local"]
description = "Check repository metadata, branch policy, and whitespace"
depends = ["check:repository", "check:branch-policy", "check:diff"]

[tasks."worktree:diagnose"]
description = "Report worktree branch ownership, setup state, and safe remediation"
run = "go run ./cmd/diagnose-worktree \"$@\""

[tasks.lint]
description = "Lint GitHub Actions, Python, shell, and Go sources"
depends = ["lint:actions", "lint:python", "lint:shell", "lint:go"]

[tasks."check:hosts"]
description = "Validate local installation for Codex and Claude Code"
run = "go run ./cmd/validate-hosts"

[tasks.verify-fsl]
description = "Check and verify every FSL specification"
depends = ["fsl:install"]
run = "go run ./cmd/verify-fsl"

[tasks."fsl:install"]
description = "Install the pinned FSL verifier with checksum verification"
run = "bash scripts/fsl/install-fslc.sh"

[tasks.mutate-fsl]
description = "Measure mutation detection for every selected FSL specification; pass options after --"
depends = ["fsl:install"]
run = "go run ./cmd/mutate-fsl \"$@\""

[tasks."mutate-fsl:changed"]
description = "Run FSL mutation only on specifications changed since a git revision"
depends = ["fsl:install"]
run = "go run ./cmd/mutate-fsl --changed-base \"$@\""

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows"
run = "actionlint"

[tasks."lint:go"]
description = "Format-check and vet Go sources"
run = '''
unformatted="$(gofmt -l .)"
if [ -n "${unformatted}" ]; then
  echo "Go files are not gofmt-formatted:" >&2
  echo "${unformatted}" >&2
  exit 1
fi
go vet ./...
'''

[tasks."lint:python"]
description = "Lint and format-check Python template sources under skills/"
run = "RUFF_CACHE_DIR=\"${RUNNER_TEMP:-${TMPDIR:-/tmp}}/skills-ruff-cache\" ruff check skills && RUFF_CACHE_DIR=\"${RUNNER_TEMP:-${TMPDIR:-/tmp}}/skills-ruff-cache\" ruff format --check skills"

[tasks."test:go"]
description = "Run the Go repository test suite"
run = "go test ./..."

[tasks."test:json"]
description = "Run Go tests and emit machine-consumable JSON"
run = "go test -json ./..."

[tasks.test]
description = "Run repository tests"
depends = ["test:go"]

[tasks."lint:shell"]
description = "Lint Bash and POSIX shell scripts"
run = '''
find scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck --shell=bash
shellcheck --shell=sh .githooks/commit-msg
shellcheck --shell=sh .githooks/post-checkout
shellcheck --shell=sh .githooks/pre-commit
shellcheck --shell=sh .githooks/pre-push
'''

[tasks."setup:commitlint"]
description = "Install the project-local commitlint binary"
run = "bash scripts/setup/setup-commitlint.sh"

[tasks."setup:local-skills"]
description = "Enable local Git hooks and register repository skills for Codex and Claude Code"
run = "bash scripts/setup/setup-local-skills.sh"

[tasks."check:skills"]
description = "Validate publishable Agent Skills"
run = "gh skill publish --dry-run"

[tasks.evaluate]
description = "Run the outcome-based behavioral evaluation suite locally"
run = "go run ./cmd/evaluate \"$@\""

[tasks."evaluate:smoke"]
description = "Run the minimum behavioral evaluation smoke set locally on opencode and antigravity"
run = "go run ./cmd/evaluate --smoke-only --host opencode,antigravity \"$@\""

[tasks.verify-release]
description = "Verify a release tag matches the catalog and committed state"
run = "go run ./cmd/verify-release \"$@\""

[tasks."release:publish"]
description = "Run release gates, then publish a verified release tag"
run = "go run ./cmd/publish-release \"$@\""

[tasks."generate:public-status"]
description = "Regenerate the README public status section from CATALOG.yml and release evidence"
run = "go run ./cmd/generate-public-status --write"

[tasks."check:repository"]
description = "Validate repository policy, sensitive content, licenses, and test evidence"
run = "go run ./cmd/check-repository"

[tasks."check:diff"]
description = "Reject whitespace errors in local changes and the committed CI diff"
run = "go run ./cmd/check-whitespace"

[tasks."check:branch-policy"]
description = "Validate the repository pull-request branch policy configuration"
run = "go run ./cmd/validate-branch-policy --validate-config"

[tasks.validate-skill-creator]
description = "Validate every published skill with Codex skill-creator"
run = "go run ./cmd/validate-skill-creator"
