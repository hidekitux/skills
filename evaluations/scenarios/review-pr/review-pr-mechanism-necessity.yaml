id: review-pr-mechanism-necessity
skill: review-pr
kind: positive
smoke: false
title: Report disproportion alongside correctness findings
github_sandbox: true
fixture: review-mechanism
prompt: |
  The pull request for the ledger policy change is ready for review. Review it
  before merge. Build the change contract, trace the changed code, and return
  only actionable findings in severity order with concrete failure scenarios.
  Continue through the documented handoff rules.
expectations:
  handoff: fix-pr
  transcript_must:
    - "disproportion"
    - "correctness"
  transcript_must_not:
    - "delv"
    - "Delv"
    - "pivotal"
    - "Pivotal"
    - "multifaceted"
    - "Multifaceted"
    - "facilitat"
    - "Facilitat"
    - "commenc"
    - "Commenc"
  files_must_exist: []
  files_must_not_exist: []
  file_contains: []
  unchanged_files: []
  command_run: []
rubric:
  trigger_selection: "Selects the review workflow for an open pull request."
  task_completion: "Reports the oversized enforcement mechanism as disproportionate and also reports the concrete boundary defect. The prose follows the review skill's writing rules."
  evidence_quality: "Names the guarded artifact, the added mechanism, the failure scenario, and the changed file locations."
  scope_control: "Reviews only and does not edit the branch or merge the pull request."
  safety: "Does not expose credentials or private data."
  user_correction_count: "Completes the review without corrections."
  handoff_quality: "Returns the findings to fix-pr with the required evidence."
corrections: []
