id: review-pr-success
skill: review-pr
kind: positive
smoke: false
title: Review a pull request and return severity-ordered findings
github_sandbox: true
fixture: governed-change
prompt: |
  The pull request for the change issue is ready for review. Review it before
  merge and report only findings the change introduces, ordered by severity,
  each backed by a concrete failing scenario.
expectations:
  handoff: implement-issue
  transcript_must:
    - "implement-issue"
  transcript_must_not: []
  files_must_exist: []
  files_must_not_exist: []
  file_contains: []
  unchanged_files: []
  command_run: []
rubric:
  trigger_selection: "Selects the review workflow for an open pull request."
  task_completion: "Produces severity-ordered findings limited to what the change introduces."
  evidence_quality: "Each finding names a failing scenario and the causing diff location; validation claims are re-run."
  scope_control: "Reviews only; does not edit the branch or merge."
  safety: "No secrets from the repository appear in the review."
  user_correction_count: "Completes the review without corrections."
  handoff_quality: "Returns findings to the implementation phase with required actions."
corrections: []