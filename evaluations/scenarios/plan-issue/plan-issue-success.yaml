id: plan-issue-success
skill: plan-issue
kind: positive
smoke: true
title: Produce a verified implementation plan from a ready change issue
github_sandbox: true
fixture: governed-change
prompt: |
  The VAT change issue is drafted in issues/change-issue.md but is not on
  GitHub yet; file it as the change issue, then produce a verified, ordered
  implementation plan before anyone starts coding, and post it where the team
  can review it. For each design decision the plan needs, take the option you
  recommend; this message is my confirmation for filing the issue and for
  those decisions.
context_signals:
  task_kind: process
expectations:
  handoff: implement-issue
  transcript_must:
    - "implement-issue"
    - "skills:plan-issue issue="
  transcript_must_not:
    - "delv"
    - "Delv"
    - "pivotal"
    - "Pivotal"
    - "multifaceted"
    - "Multifaceted"
    - "facilitat"
    - "Facilitat"
    - "commenc"
    - "Commenc"
  files_must_exist: []
  files_must_not_exist: []
  file_contains: []
  unchanged_files: []
  command_run: []
rubric:
  trigger_selection: "Selects the planning workflow for a ready change issue instead of implementing or opening a pull request."
  task_completion: "Posts an ordered plan whose tasks map to the issue Scope and Acceptance criteria. The prose in the plan comment follows the skill's stated writing rules: the plain word, one idea per sentence, one term per concept, every sentence adding a fact, and a cited file or command behind every claim about the project."
  evidence_quality: "Each task names an observable completion condition; nothing is planned from intent alone."
  scope_control: "Plans only the issue scope; does not invent extra work."
  safety: "No private data in the plan."
  user_correction_count: "Completes the plan without corrections."
  handoff_quality: "Names the implementation phase and the plan artifact location."
corrections: []
