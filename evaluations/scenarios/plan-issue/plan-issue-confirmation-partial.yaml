id: plan-issue-confirmation-partial
skill: plan-issue
kind: boundary
smoke: false
title: Keep the plan blocked after a partial architecture answer
github_sandbox: true
fixture: plan-issue-architecture
prompt: |
  The change issue at issues/change-issue.md is ready. Produce a verified,
  ordered implementation plan before coding begins, and post it where the
  team can review it.
expectations:
  handoff: blocked-ask
  transcript_must:
    - "confirmation"
  transcript_must_not:
    - "## Implementation plan"
  files_must_exist: []
  files_must_not_exist: []
  file_contains: []
  unchanged_files: []
  command_run: []
rubric:
  trigger_selection: "Selects the planning workflow for the ready change issue."
  task_completion: "Keeps the final plan blocked when only one architecture choice is confirmed."
  evidence_quality: "Identifies the confirmed choice and the missing choice."
  scope_control: "Does not derive tasks from the partial answer."
  safety: "Does not treat a partial answer as approval of all recommendations."
  user_correction_count: "Stops after the scripted partial answer."
  handoff_quality: "Asks for the remaining confirmation instead of handing off implementation."
corrections:
  - "I confirm only the first architecture decision. I have not decided the second one."
