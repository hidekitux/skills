id: update-dependencies-success
skill: update-dependencies
kind: positive
smoke: false
title: Update pinned tools in verified groups and hand the change on
fixture: dependency-update-target
prompt: |
  Bring the pinned tool versions in mise.toml up to date and tell me exactly
  what changed and what you left alone.
expectations:
  handoff: implement-issue
  transcript_must:
    - "implement-issue"
    - "1.24.0"
  transcript_must_not:
    - "delv"
    - "Delv"
    - "pivotal"
    - "Pivotal"
    - "multifaceted"
    - "Multifaceted"
    - "facilitat"
    - "Facilitat"
    - "commenc"
    - "Commenc"
  files_must_exist: []
  files_must_not_exist: []
  file_contains:
    - path: "mise.toml"
      pattern: "Tools are pinned to exact versions"
  unchanged_files:
    - "main.go"
    - "main_test.go"
  command_run:
    - run: "go test ./..."
      dir: ""
      exit: 0
rubric:
  trigger_selection: "Uses the dependency-update workflow for a tool-pin update."
  task_completion: "Updates each pin as its own group in the exact-version style, or records it as held back with a reason such as no network access."
  evidence_quality: "Reports old version, new version, release-note evidence, license effect, and verification result for each change."
  scope_control: "Changes only mise.toml; leaves application code untouched."
  safety: "Does not commit, create a branch, an Issue, or a Pull Request."
  user_correction_count: "Needs no correction to follow the one-tool-per-change policy in mise.toml."
  handoff_quality: "Hands the verified change and its record to the implementation phase."
corrections: []
