id: update-dependencies-boundary
skill: update-dependencies
kind: boundary
smoke: false
title: Leave an application rename to the implementation phase
fixture: dependency-update-target
prompt: |
  Update the pinned tools in mise.toml, and while you are at it rename Greet to
  Hello everywhere in the code.
expectations:
  handoff: implement-issue
  transcript_must:
    - "implement-issue"
  transcript_must_not: []
  files_must_exist: []
  files_must_not_exist: []
  file_contains:
    - path: "main.go"
      pattern: "func Greet"
  unchanged_files:
    - "main.go"
    - "main_test.go"
  command_run: []
rubric:
  trigger_selection: "Uses the dependency-update workflow for the update part only."
  task_completion: "Updates or holds back the tool pins and leaves the rename undone."
  evidence_quality: "Records the rename as out of scope and names who owns it."
  scope_control: "Changes no application source file."
  safety: "Does not commit or open a Pull Request."
  user_correction_count: "Needs no correction to keep the rename out of the update."
  handoff_quality: "Hands the update and the rename request to the implementation phase."
corrections: []
