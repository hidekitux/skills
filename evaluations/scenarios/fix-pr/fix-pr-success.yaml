id: fix-pr-success
skill: fix-pr
kind: positive
smoke: false
title: Fix the returned findings and leave the pushed head equal to the reviewed commit
github_sandbox: true
fixture: governed-change
prompt: |
  A reviewer left two findings on the open pull request for this branch: a
  boundary condition that is never checked, and a commit whose header does not
  follow the repository convention. Address both, then make sure the published
  branch is what a second reviewer would see.
expectations:
  handoff: review-pr
  transcript_must:
    - "review-pr"
  transcript_must_any:
    - "--force-with-lease"
    - "headRefOid"
  transcript_must_not: []
  files_must_exist: []
  files_must_not_exist: []
  file_contains: []
  unchanged_files: []
  command_run: []
rubric:
  trigger_selection: "Selects the post-review iteration workflow because the branch already has an open pull request with findings."
  task_completion: "Fixes both findings, pushes, and syncs the pull request body in one invocation."
  evidence_quality: "Records each finding with its disposition, commit hash, and the validation actually run."
  scope_control: "Edits only what the findings justify; does not widen the change or open a second pull request."
  safety: "No credentials or private data; no plain force push and no rewrite of already-reviewed remote commits."
  user_correction_count: "Completes the cycle without corrections."
  handoff_quality: "Confirms the pushed head equals the commit the next review will identify and names the review phase as next owner."
corrections: []
