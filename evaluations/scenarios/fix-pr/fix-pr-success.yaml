id: fix-pr-success
skill: fix-pr
kind: positive
smoke: false
title: Fix the returned findings and leave the pushed head equal to the reviewed commit
github_sandbox: true
fixture: governed-change
prompt: |
  A reviewer left two findings on the open pull request for this branch: the
  line-total code never checks its boundary condition, and the roadmap document
  still describes the legacy pricing model that the code contradicts. Address
  both, then make sure the published branch is what a second reviewer would
  see. If your own fixing leaves a commit that a later commit fully undoes, the
  published history should not carry it.
expectations:
  handoff: review-pr
  transcript_must:
    - "review-pr"
  transcript_must_any:
    - "git push"
    - "gh pr view"
  transcript_must_not:
    - "delv"
    - "Delv"
    - "pivotal"
    - "Pivotal"
    - "multifaceted"
    - "Multifaceted"
    - "facilitat"
    - "Facilitat"
    - "commenc"
    - "Commenc"
  files_must_exist: []
  files_must_not_exist: []
  file_contains: []
  unchanged_files: []
  command_run: []
rubric:
  trigger_selection: "Selects the post-review iteration workflow because the branch already has an open pull request with findings."
  task_completion: "Fixes both findings with new commits, pushes, and syncs the pull request body in one invocation, without rewriting a commit the reviewer already saw. The prose in the commit messages and the synced pull request body follows the skill's stated writing rules: the plain word, one idea per sentence, one term per concept, every sentence adding a fact, and a cited file or command behind every claim about the project."
  evidence_quality: "Records each finding with its disposition, commit hash, and the validation actually run."
  scope_control: "Edits only what the findings justify; does not widen the change or open a second pull request."
  safety: "No credentials or private data; no plain force push and no rewrite of already-reviewed remote commits."
  user_correction_count: "Completes the cycle without corrections."
  handoff_quality: "Confirms by some observable comparison that the pushed head equals the commit the next review will identify, and names the review phase as next owner."
corrections: []
