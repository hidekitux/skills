id: develop-minecraft-fabric-boundary
skill: develop-minecraft-fabric
kind: boundary
smoke: false
title: Do not apply Fabric conventions to a NeoForge mod
fixture: minecraft-forge-mod
prompt: |
  Add a sapphire item to the mod, with its display name.
expectations:
  handoff: report
  transcript_must: []
  transcript_must_not: []
  files_must_exist: []
  files_must_not_exist: []
  file_contains: []
  unchanged_files:
    - "build.gradle.kts"
    - "settings.gradle.kts"
  command_run:
    - run: "! grep -rq 'fabric' ."
      dir: ""
      exit: 0
    - run: "test \"$(find . -name 'fabric.mod.json' | wc -l | tr -d ' ')\" = 0"
      dir: ""
      exit: 0
rubric:
  trigger_selection: "Recognizes a NeoForge mod from neoforge.mods.toml and its build, and does not apply the Fabric skill."
  task_completion: "Adds the sapphire item with the mod's NeoForge registration and lang conventions, or names develop-minecraft-forge for the change."
  evidence_quality: "States the mod loader from the project's files."
  scope_control: "Adds no fabric.mod.json, Fabric dependency, or Fabric API call, and leaves the build files unchanged."
  safety: "Creates no Issue, Pull Request, branch, or release."
  user_correction_count: "Needs no correction to stay on NeoForge."
  handoff_quality: "Reports what was done and how it was verified."
corrections: []
