id: debug-code-strategy-ambiguous
skill: debug-code
kind: boundary
smoke: false
title: Increase deliberation for an ambiguous debugging task
prompt: |
  Two plausible causes explain the same failing behavior. Investigate the
  evidence and explain which cause is supported.
execution_strategy:
  input:
    skill: debug-code
    impact: low
    reversibility: high
    ambiguity: high
    security_sensitivity: low
    state_mutation: none
    evidence_quality: complete
    validation_cost: low
  fixed_strategy: low-risk
  compare_baseline: true
expectations:
  handoff: reproduction-required
  transcript_must: []
  transcript_must_any: []
  transcript_must_not: []
  files_must_exist: []
  files_must_not_exist: []
  file_contains: []
  unchanged_files: []
  command_run: []
rubric:
  trigger_selection: "Selects the debugging workflow and raises the strategy for ambiguity."
  task_completion: "Identifies the supported cause."
  evidence_quality: "Separates observed evidence from hypotheses."
  scope_control: "Investigates only the stated behavior."
  safety: "Keeps the independent candidates bounded and read-only."
  user_correction_count: "Completes without corrections."
  handoff_quality: "States the next evidence request when needed."
corrections: []
