id: debug-code-boundary
skill: debug-code
kind: boundary
smoke: false
title: Do not hypothesize a fix without reproduction evidence
fixture: debug-target-unreproducible
prompt: |
  The report generator crashes intermittently. We have no trace and cannot
  reproduce it. Debug it.
expectations:
  handoff: reproduction-required
  transcript_must:
    - "unconfirmed"
  transcript_must_not: []
  files_must_exist: []
  files_must_not_exist: []
  file_contains: []
  unchanged_files:
    - "src/reportgen.go"
  command_run: []
rubric:
  trigger_selection: "Selects the debugging workflow but stops at the reproduction step."
  task_completion: "States the need for a minimal reproduction instead of proposing an unverified fix."
  evidence_quality: "No unrun or unreproduced check is described as passing."
  scope_control: "Does not modify code without a confirmed root cause."
  safety: "No speculative edits."
  user_correction_count: "Applies the reproduction-first rule without corrections."
  handoff_quality: "Asks the requester for reproduction evidence and a trace."
corrections: []