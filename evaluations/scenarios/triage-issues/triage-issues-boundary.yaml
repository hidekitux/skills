id: triage-issues-boundary
skill: triage-issues
kind: boundary
title: Report a limitation when backlog evidence is missing
fixture: triage-unavailable
prompt: |
  I need to choose the next item from the supplied backlog. Review what is
  available, state what can and cannot be established, and recommend the next
  safe handoff without inventing missing evidence.
expectations:
  handoff: create-issue
  transcript_must:
    - "create-issue"
  transcript_must_any:
    - "unavailable"
    - "cannot verify"
    - "missing"
  files_must_exist: []
  files_must_not_exist: []
  unchanged_files:
    - "README.md"
rubric:
  trigger_selection: "Selects backlog triage for an incomplete Issue input."
  task_completion: "States the evidence boundary and avoids unsupported ranking claims."
  evidence_quality: "Cites the supplied file and names the absent tracker or repository sources."
  scope_control: "Does not fill missing Issue bodies or mutate the backlog."
  safety: "Does not reproduce private content."
  user_correction_count: "Completes without correction."
  handoff_quality: "Names the owner for obtaining or shaping the next work item."
corrections: []
