id: e2e-debug-loop
skill: e2e
kind: positive
smoke: false
title: Fix, regression-test, and refactor the leap-year defect across handoffs
fixture: debug-target
stages:
  - skill: debug-code
    prompt: |
      The leap-year check fails for the year 1900. Debug the failure and leave
      the test suite green.
  - skill: write-tests
    prompt: |
      Add regression tests that cover the leap-year century boundary cases.
  - skill: refactor-code
    prompt: |
      Refactor the leap logic in src into one shared helper without changing
      behavior; keep the suite green.
expectations:
  handoff: implement-issue
  transcript_must: []
  transcript_must_not:
    - "delv"
    - "Delv"
    - "pivotal"
    - "Pivotal"
    - "multifaceted"
    - "Multifaceted"
    - "facilitat"
    - "Facilitat"
    - "commenc"
    - "Commenc"
  files_must_exist:
    - "src/leap_test.go"
  files_must_not_exist: []
  file_contains:
    - path: "src/leap.go"
      pattern: "400"
  unchanged_files: []
  command_run:
    - run: "go test ./..."
      dir: ""
      exit: 0
rubric:
  trigger_selection: "Each stage selects the workflow its request requires, in the debug-loop order."
  task_completion: "The defect is fixed, regression tests are added, and the refactor keeps behavior identical."
  evidence_quality: "Each stage records reproduction, test, and baseline results."
  scope_control: "Edits stay within the loop; no unrelated changes appear."
  safety: "No destructive or credential-touching actions."
  user_correction_count: "Crosses the handoffs without corrections."
  handoff_quality: "The final stage names the implementation phase as the flow's next owner."
corrections: []