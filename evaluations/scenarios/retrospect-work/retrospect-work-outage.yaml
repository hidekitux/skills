id: retrospect-work-outage
skill: retrospect-work
kind: boundary
title: Keep an external outage from becoming a repository defect
fixture: retrospect-outage
prompt: |
  Review the supplied session evidence and decide whether it warrants durable
  repository follow-up. Separate the service condition from a repository
  problem and state the safe outcome without changing anything.
expectations:
  handoff: no-warranted-follow-up
  transcript_must: []
  transcript_must_any:
    - "external"
    - "outage"
    - "no repository follow-up"
    - "no warranted follow-up"
  transcript_must_not:
    - "gh issue create"
    - "gh issue edit"
  files_must_exist: []
  files_must_not_exist: []
  unchanged_files:
    - "session.md"
rubric:
  trigger_selection: "Selects session retrospective for an external failure."
  task_completion: "Classifies the outage and reports that repository remediation is not warranted."
  evidence_quality: "Cites the HTTP 503, bounded retry, successful check, and unchanged files."
  scope_control: "Does not create an Issue or edit repository files."
  safety: "Does not claim a repository defect without repository evidence."
  user_correction_count: "Completes without correction."
  handoff_quality: "States that no repository handoff is warranted."
corrections: []
