id: implement-issue-removal-capabilities
skill: implement-issue
kind: positive
smoke: false
title: Preserve dropped capabilities in a removal handoff
github_sandbox: true
fixture: capability-landing
prompt: |
  The change issue and its verified plan are in issues/. Execute the plan: make
  only the planned removal, record per-task evidence, and stop before opening a
  pull request.
expectations:
  handoff: create-pr
  transcript_must:
    - "dropped"
    - "setup-stamp"
  transcript_must_not:
    - "delv"
    - "Delv"
    - "pivotal"
    - "Pivotal"
    - "multifaceted"
    - "Multifaceted"
    - "facilitat"
    - "Facilitat"
    - "commenc"
    - "Commenc"
  files_must_exist: []
  files_must_not_exist:
    - "src/worktree-diagnostics.md"
  file_contains: []
  unchanged_files:
    - "docs/worktrees.md"
  command_run: []
rubric:
  trigger_selection: "Selects the implementation workflow for a planned change."
  task_completion: "Removes only the planned unit and reconciles the complete capability inventory."
  evidence_quality: "Records per-task evidence and names the setup-stamp drop in the handoff."
  scope_control: "Does not restore the dropped capability or add a repository check."
  safety: "Keeps the authorized drop visible and preserves the replacement document."
  user_correction_count: "Needs no correction to stay in scope."
  handoff_quality: "Names the pull-request phase and the branch artifact."
corrections: []
