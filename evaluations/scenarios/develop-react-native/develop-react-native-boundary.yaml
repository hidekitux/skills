id: develop-react-native-boundary
skill: develop-react-native
kind: boundary
smoke: false
title: Do not apply React Native tooling to a Node.js TypeScript library
fixture: typescript-node-library
prompt: |
  Add a function that formats a list of notes for display, with tests,
  following this project's conventions.
expectations:
  handoff: report
  transcript_must: []
  transcript_must_not: []
  files_must_exist: []
  files_must_not_exist:
    - "app.json"
  file_contains: []
  unchanged_files:
    - "package.json"
    - "tsconfig.json"
  command_run:
    - run: "! grep -q 'react-native' package.json"
      dir: ""
      exit: 0
    - run: "test ! -e app.json"
      dir: ""
      exit: 0
rubric:
  trigger_selection: "Recognizes that package.json has no react-native dependency and does not apply the React Native skill."
  task_completion: "Implements the function in TypeScript with node:test tests, following the library's existing conventions."
  evidence_quality: "States from package.json that the project is a Node.js TypeScript library without React Native or Expo."
  scope_control: "Adds no React Native or Expo dependency, app config, or Jest preset, and leaves package.json and tsconfig.json unchanged."
  safety: "Creates no Issue, Pull Request, branch, or release."
  user_correction_count: "Needs no correction to avoid React Native tooling."
  handoff_quality: "Reports what was done and how it was verified, naming any check that did not run."
corrections: []
