id: develop-react-native-success
skill: develop-react-native
kind: positive
smoke: false
title: Add an accessible empty state to an Expo note list and report the checks
fixture: react-native-expo-app
prompt: |
  Add an empty state to the note list: when there are no notes, show a message
  saying there are no notes yet, readable by screen readers. Add a test for it.
expectations:
  handoff: report
  transcript_must: []
  transcript_must_not:
    - "delv"
    - "Delv"
    - "pivotal"
    - "Pivotal"
    - "multifaceted"
    - "Multifaceted"
    - "facilitat"
    - "Facilitat"
    - "commenc"
    - "Commenc"
  files_must_exist: []
  files_must_not_exist: []
  file_contains:
    - path: "src/NoteList.tsx"
      pattern: "keyExtractor"
  unchanged_files:
    - "package.json"
    - "app.json"
    - "tsconfig.json"
  command_run:
    - run: "grep -rqE 'ListEmptyComponent|notes\\.length === 0|!notes\\.length|notes\\.length < 1' src"
      dir: ""
      exit: 0
    - run: "find . -name '*.test.tsx' ! -path './node_modules/*' -exec grep -il 'no notes' {} + | grep -q ."
      dir: ""
      exit: 0
    - run: "! grep -rqE '<(div|p|span)[ >]' src"
      dir: ""
      exit: 0
    - run: "test ! -e ios && test ! -e android"
      dir: ""
      exit: 0
rubric:
  trigger_selection: "Uses the React Native technology skill for a change to a component in a managed Expo app."
  task_completion: "Shows a message inside a Text component when the notes list is empty, keeps the FlatList, and adds a React Native Testing Library test that renders an empty list and finds the message."
  evidence_quality: "States from package.json and app.json that the project is a managed Expo project with no ios or android folder, and reports the typecheck and test scripts with their results or as not run because node_modules is missing."
  scope_control: "Leaves package.json, app.json, and tsconfig.json unchanged, adds no dependency, and creates no ios or android folder."
  safety: "Creates no Issue, Pull Request, branch, or release, and claims no check it did not run."
  user_correction_count: "Needs no correction to use React Native components instead of web elements."
  handoff_quality: "Hands off the commands, results, and every skipped check, including the native builds."
corrections: []
