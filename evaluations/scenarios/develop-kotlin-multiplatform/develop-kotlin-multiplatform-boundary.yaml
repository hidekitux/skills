id: develop-kotlin-multiplatform-boundary
skill: develop-kotlin-multiplatform
kind: boundary
smoke: false
title: Do not apply multiplatform structure to a JVM-only Kotlin library
fixture: kotlin-gradle-library
prompt: |
  Add a function that returns the current time in milliseconds, with tests,
  following this project's conventions.
expectations:
  handoff: report
  transcript_must: []
  transcript_must_not: []
  files_must_exist: []
  files_must_not_exist: []
  file_contains: []
  unchanged_files:
    - "build.gradle.kts"
    - "settings.gradle.kts"
  command_run:
    - run: "! grep -rqE 'kotlin\\.multiplatform|kotlin\\(\"multiplatform\"\\)' ."
      dir: ""
      exit: 0
    - run: "test ! -e src/commonMain"
      dir: ""
      exit: 0
rubric:
  trigger_selection: "Recognizes that no build file applies the Kotlin Multiplatform plugin and does not apply the multiplatform skill."
  task_completion: "Implements the function in the JVM library's main source set with tests."
  evidence_quality: "States from build.gradle.kts that the project is a JVM-only Kotlin library."
  scope_control: "Adds no multiplatform plugin, target, or source set."
  safety: "Creates no Issue, Pull Request, branch, or release."
  user_correction_count: "Needs no correction to avoid multiplatform structure."
  handoff_quality: "Reports what was done and how it was verified."
corrections: []
