id: write-docs-success
skill: write-docs
kind: positive
smoke: false
title: Bring a stale README in line with the code
fixture: docs-drift-target
prompt: |
  The README for this package is out of date. Please update it so it matches
  how the package works today.
expectations:
  handoff: implement-issue
  transcript_must:
    - "implement-issue"
  transcript_must_not:
    - "delv"
    - "Delv"
    - "pivotal"
    - "Pivotal"
    - "multifaceted"
    - "Multifaceted"
    - "facilitat"
    - "Facilitat"
    - "commenc"
    - "Commenc"
  files_must_exist: []
  files_must_not_exist: []
  file_contains:
    - path: "README.md"
      pattern: "retry.Do("
    - path: "README.md"
      pattern: "mise run test:all"
  unchanged_files:
    - "retry.go"
    - "retry_test.go"
  command_run:
    - run: "! grep -q 'retry.Run' README.md"
      dir: ""
      exit: 0
    - run: "! grep -q 'make test' README.md"
      dir: ""
      exit: 0
rubric:
  trigger_selection: "Uses the documentation workflow for a stale README."
  task_completion: "Documents Do with its delay parameter, removes the false default claim, and names the project's test task."
  evidence_quality: "Reports each claim with its source, such as retry.go and mise.toml, and lists any unverified claim."
  scope_control: "Changes only README.md."
  safety: "Does not commit, create a branch, an Issue, or a Pull Request."
  user_correction_count: "Needs no correction to remove claims the code does not support."
  handoff_quality: "Hands the documentation change and its claim record to the implementation phase."
corrections: []
