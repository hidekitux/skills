name: Notes
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  Notes:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Notes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.notes
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  NotesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - NotesTests
    dependencies:
      - target: Notes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.notes.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Notes:
    build:
      targets:
        Notes: all
        NotesTests: [test]
    test:
      targets:
        - NotesTests
